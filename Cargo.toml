[package]
name = "coding-mcp-server"
version = "0.1.0"
edition = "2021"

[dependencies]
rmcp = "0.9.0"
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
schemars = "1.0"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
glob = "0.3"
walkdir = "2.5"
regex = "1.11"
ignore = "0.4"
html2text = "0.12"
url = "2.5"
scraper = "0.22"
urlencoding = "2.1"