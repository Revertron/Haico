[package]
name = "haico"
version = "0.2.23"
edition = "2021"
description = "HAICO (Home AI Coder) - Interactive CLI coding assistant for local LLMs with a custom MCP-server."

# The GUI frontend is opt-in: it pulls winit, glutin, image and resvg, which is a
# lot of dependency for a tool whose first job is a terminal. `cargo build
# --features gui` gets a binary that answers `--gui`; without it that flag says so
# and exits.
[features]
default = []
gui = ["dep:lumio-gui", "dep:pulldown-cmark"]

[dependencies]
# Both backends, which gives GL with an automatic software fallback: haico gets
# run in VMs and over forwarded displays, and the cost of the second backend is
# tree size rather than runtime. The software one is also what makes the GUI
# testable — it renders to a pixmap with no window at all.
lumio-gui = { path = "../Lumio", optional = true, features = ["backend-software"] }
# Only the GUI parses markdown into a view tree. The terminal has its own
# streaming renderer in render.rs, which emits escapes rather than structure and
# is not reusable here — see plan.md 11.4.
pulldown-cmark = { version = "0.13", optional = true, default-features = false }
rmcp = { version = "3.4.0", features = ["transport-io"] }
reqwest = { version = "0.13", features = ["json", "gzip", "deflate", "brotli", "zstd", "cookies"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
schemars = "1.0"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
regex = "1.11"
html2text = "0.17.1"
url = "2.5"
scraper = "0.27.0"
urlencoding = "2.1"
crossterm = "0.29.0"
similar = "3.1.1"
chrono = "0.4.42"
getopts = "0.2"
lru = "0.18.0"
flate2 = "1"
public-api = "0.52"
dom_smoothie = "0.18.0"
ego-tree = "0.11.0"
ignore = "0.4.33"
globset = "0.4.20"
toml = "1.1.4"
# Reading the config is `toml`'s job; writing one setting back into it is this one's.
# The file is the user's — hand-written, commented, ordered the way they wanted it — so
# saving a model or a context window has to edit the one key and leave the rest of the
# document byte for byte as it was. Serializing `FileConfig` back over it would answer
# "set one key" by deleting every comment in the file.
toml_edit = "0.25"
unicode-width = "0.2.2"
# An image in a message goes out as a data: URL, which is what every OpenAI-compatible
# server takes. Encoding one is the whole use.
base64 = "0.23"
# Decoding one format, and encoding one. WEBP is the format the servers disagree about:
# LM Studio refuses the string "image/webp" in a data URL while decoding the bytes
# happily, and llama.cpp is the mirror image — it takes the label and cannot decode the
# bytes at all without an optional ffmpeg build. Re-encoding to PNG is the only answer
# that is true on both. Default features off: this is a converter, not an image library.
image = { version = "0.25", default-features = false, features = ["webp", "png"] }

# Windows only, and only for the full-screen renderer's mouse.
#
# Getting the wheel out of the Windows console means ENABLE_VIRTUAL_TERMINAL_INPUT, which
# makes the console deliver *everything* as escape sequences — and crossterm's Windows
# reader maps INPUT_RECORDs one at a time with no parser, so it reports an arrow key as
# the characters "[", "A" and then Up. `terminput` is crossterm's own Unix escape parser
# published as a standalone crate, so the byte stream can be read and parsed the way it
# is meant to be. The adapter converts its events back to crossterm's, which is what the
# rest of haico is written against.
[target.'cfg(windows)'.dependencies]
terminput = "0.5"
terminput-crossterm = "0.4"
# Shift+Insert is the console's own paste shortcut, and VT input mode takes it away by
# forwarding the key to haico instead of acting on it. Pasting therefore has to be done
# here, which means reading the clipboard.
clipboard-win = "5"
