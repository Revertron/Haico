[package]
name = "haico"
version = "0.2.9"
edition = "2021"
description = "Interactive CLI coding assistant for local LLMs (via LM Studio) with a custom “MCP” tool router."

[dependencies]
rmcp = { version = "3.1.0", features = ["transport-io"] }
reqwest = { version = "0.13.4", features = ["json", "gzip", "deflate", "brotli", "zstd", "cookies"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
schemars = "1.0"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
regex = "1.11"
html2text = "0.17.1"
url = "2.5"
scraper = "0.27.0"
urlencoding = "2.1"
crossterm = "0.29.0"
similar = "3.1.1"
chrono = "0.4.42"
getopts = "0.2"
lru = "0.18.0"
flate2 = "1"
public-api = "0.52"
dom_smoothie = "0.18.0"
ego-tree = "0.11.0"
ignore = "0.4.33"
globset = "0.4.20"
toml = "1.1.4"
