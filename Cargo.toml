[package]
name = "haico"
version = "0.2.8"
edition = "2021"
description = "This Rust project implements an interactive CLI assistant that integrates a LLM client (via LM Studio) with a custom “MCP” tool router. It defines numerous utility tools—calculator, file read/write/edit, glob/glob‑search, regex grep, web fetch/search, directory listing, and bash execution—each described via JSON schemas. A permission manager prompts the user for safe‑execution of potentially risky tools (e.g., web access or shell commands). The main loop reads user input, sends it to the LLM, parses tool calls from the model’s response, obtains permission, executes the selected tool, and feeds the result back into the conversation. This showcases a seamless blend of language model interactions with programmable system actions."

[dependencies]
rmcp = { version = "3.1.0", features = ["transport-io"] }
reqwest = { version = "0.13.4", features = ["json", "gzip", "deflate", "brotli", "zstd", "cookies"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
schemars = "1.0"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
regex = "1.11"
html2text = "0.17.1"
url = "2.5"
scraper = "0.27.0"
urlencoding = "2.1"
crossterm = "0.29.0"
similar = "3.1.1"
chrono = "0.4.42"
getopts = "0.2"
lru = "0.18.0"
flate2 = "1"
public-api = "0.52"
dom_smoothie = "0.18.0"
ego-tree = "0.11.0"
ignore = "0.4.33"
globset = "0.4.20"
toml = "1.1.4"
